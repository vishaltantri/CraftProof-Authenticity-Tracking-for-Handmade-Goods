services:
  - type: web
    name: craftproof-backend
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # REQUIRED: set a real secret in the Render dashboard (>= 32 chars).
      # Example generate: python3 -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: JWT_SECRET_KEY
        sync: false
      # Anchoring: keep the journal + key outside the DB volume. 'local'
      # backend (default) signs roots with an Ed25519 key stored at
      # CRAFTPROOF_ANCHOR_KEY; switch to 'freetsa' for RFC 3161 timestamps.
      - key: CRAFTPROOF_ANCHOR_BACKEND
        value: local
      - key: CRAFTPROOF_ANCHOR_JOURNAL
        value: /var/data/anchor/journal.jsonl
      - key: CRAFTPROOF_ANCHOR_KEY
        value: /var/data/anchor/anchor_key.pem
      - key: CRAFTPROOF_TEMPLATES_DIR
        value: /var/data/templates
      # NEVER set CRAFTPROOF_ALLOW_INSECURE_DEMO in a deployed environment:
      # it installs a known demo JWT secret and re-enables /admin/tamper.

  - type: web
    name: craftproof-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: craftproof-backend
          envVarKey: RENDER_EXTERNAL_URL
